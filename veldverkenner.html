<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veldverkenner</title>
    <link rel="stylesheet" href="Styles/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    
    <!--Header met website logo en gast icon-->
    <header>

        <img class="Logo" src="Images/LOGO2-removebg-preview.png" alt="Logo van Bloemenveld Frankendael">
        <img class="Gast-icon" src="Images/Gast.png" alt="Gast account icoon">

    </header>

    <!--Main content van de veldverkenner-->
    <main>
        <img class="Veldverkenner-icoon" src="Images/Vector.png" alt="Icoon voor de velkverkenner">

        <section class="introkaart">
            <h1>Veldverkenner</h1>
            <p>Scroll, klik en ontdenk!</p>
        </section>

         <!-- Interactive OpenStreetMap displaying Park Frankendael -->
        <div id ="map">

            <!-- Buttons that open the zones and explanation popups -->
          <div class="map-buttons">

            
            <button class="legenda1" onclick="showPopup('zones-dialog')">
                <img class="legenda" src="Images/legenda.png" alt="Zones">
            </button>

           
            <button class="legenda1" onclick="showPopup('uitleg-dialog')">
                <img class="legenda" src="Images/legenda2.png" alt="Uitleg">
            </button>
          </div>

        </div>

        <!-- Dialog displaying information about the different zones -->
        <dialog id="zones-dialog">
            <h2>Zones</h2>
            <img src="Images/Frame294.svg" alt="Legenda">
            <button onclick="closePopup('zones-dialog')">Terug</button>
        </dialog>

        <!-- Dialog explaining how to use the field explorer -->
        <dialog id="uitleg-dialog">
            <h2>Uitleg</h2>
            <img src="Images/Frame299.svg" alt="Legenda">

            <button onclick="closePopup('uitleg-dialog')">Terug</button>
        </dialog>

    </main>

     <!-- Footer containing the main navigation links -->
    <footer class="navfooter">

        <a href="index.html" class="nav item">
            <img class="NavIcons" src="Images/Home.PNG" alt="Home">
        </a>

        <a href="veldverkenner.html" class="nav item">
            <img class="NavIcons" src="Images/Veldverkenner.PNG" alt="Veldverkenner">
        </a>

        <a href="" class="nav item">
            <img class="NavIcons" src="Images/news.PNG" alt="Nieuws">
        </a>

        <a href="collectie.html" class="nav item">
            <img class="NavIcons" src="Images/collectie.PNG" alt="Collectie">
        </a>

    </footer>

    <!-- JavaScript file controlling the popup functionality -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
